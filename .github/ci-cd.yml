name: CI/CD Pipeline

# Trigger on pushes or pull requests to the main and development branches
on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python (choose the version you need; here we use 3.9)
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Upgrade pip and install dependencies including testing and linting tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Run unit tests (assuming your tests are located in the tests/ folder)
      - name: Run unit tests with pytest
        run: pytest tests/
